server:
  port: 8084

spring:
  application:
    name: inspection-service
  datasource:
    url: ${INSPECTION_DB_URL:jdbc:mysql://localhost:3306/cheche_inspection?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

management.endpoints.web.exposure.include: health,info

services:
  facility:
    base-url: ${FACILITY_SERVICE_URI:http://localhost:8083}
