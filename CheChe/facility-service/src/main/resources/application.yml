server:
  port: 8083

spring:
  application:
    name: facility-service
  datasource:
    url: ${FACILITY_DB_URL:jdbc:mysql://localhost:3306/cheche_facility?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management.endpoints.web.exposure.include: health,info
