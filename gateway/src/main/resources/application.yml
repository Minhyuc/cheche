server:
  port: 8080

spring:
  application:
    name: cheche-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      routes:
        - id: login-service
          uri: ${LOGIN_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**
        - id: user-profile-service
          uri: ${LOGIN_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/admins/**
        - id: facility-service
          uri: ${FACILITY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/facilities/**
        - id: user-facility-service
          uri: ${FACILITY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/user/facilities/**
        - id: user-reservation-service
          uri: ${FACILITY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/user/reservations/**
        - id: inspection-service
          uri: ${INSPECTION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/inspections/**
        - id: user-report-service
          uri: ${INSPECTION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/user/reports/**
        - id: inspection-photo-service
          uri: ${INSPECTION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/inspection-photos/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: ${JWT_SECRET:cheche-development-secret-key-change-me-2026}
  issuer: cheche-login-service

services:
  admin:
    base-url: ${ADMIN_SERVICE_URI:http://localhost:8082}
  user:
    base-url: ${LOGIN_SERVICE_URI:http://localhost:8081}
